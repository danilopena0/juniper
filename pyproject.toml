[project]
name = "juniper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "danilopena0", email = "danilopena93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.11",
]

[project.scripts]
juniper = "juniper:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
